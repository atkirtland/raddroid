plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.raddroid.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.raddroid.app"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

def resolveBuildPython() {
    def explicit = System.getenv("CHAQUOPY_PYTHON")
    if (explicit) return explicit

    // uv (https://docs.astral.sh/uv/) installs Python under ~/.local/share/uv/python.
    // Resolve the symlink: uv interpreters report sys.executable as whatever path
    // they were invoked through, so creating a venv via the link bakes a broken
    // prefix into pyvenv.cfg. Resolving also survives `uv python upgrade`.
    def uvRoot = new File(System.getenv("UV_PYTHON_INSTALL_DIR")
                          ?: "${System.getProperty('user.home')}/.local/share/uv/python")
    def link = new File(uvRoot, "cpython-3.11-linux-x86_64-gnu")
    if (link.exists()) return new File(link.canonicalFile, "bin/python3.11").path

    return "python3.11"   // fall back to PATH
}

chaquopy {
    defaultConfig {
        version "3.11"
        buildPython resolveBuildPython()
        pip {
            install "radicale"
            install "bcrypt"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
